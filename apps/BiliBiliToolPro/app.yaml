# ==============================================================================
# 白虎面板应用规范定义文件 (Baihu Application Specification)
# 应用名称: B站全自动化助手 (BiliBiliToolPro)
# 规范版本: v1
# 本文件由 apps/BiliBiliToolPro/build.py 自动构建生成 (请勿手动修改)
# ==============================================================================

spec_version: "v1"
id: "bilibili-tool-pro"
name: "B站全自动化助手 (BiliBiliToolPro)"
version: "2.1.0"
author: "RayWangQvQ"
category: "福利签到"
description: "基于 .NET 8 的 B站多功能全自动任务工具，支持每日经验投币、大会员权益礼包领取、天选时刻抽奖、粉丝牌助手与多账号管理"
icon: "https://raw.githubusercontent.com/RayWangQvQ/BiliBiliToolPro/main/docs/images/logo.png"
homepage: "https://github.com/RayWangQvQ/BiliBiliToolPro"

# ==============================================================================
# 1. 脚本代码源列表 (Sources) —— 支持定义多个源，100% 复用 baihu reposync 参数规范
# ==============================================================================
# 支持配置多个独立的代码源（例如：主业务仓库 + 外部公共工具库 + 单文件补丁直链）
# 单源场景下亦支持使用单个 source: { ... } 对象，系统自动兼容处理
sources:
  - id: "main"                        # [必填] 源唯一标识符（在下方 tasks 中通过 source: "main" 关联）
    source_type: "git"                # 对应 --source-type: git (Git仓库) 或 url (单文件下载)
    source_url: "https://github.com/RayWangQvQ/BiliBiliToolPro.git" # 对应 --source-url: 上游开源项目地址
    branch: "main"       # 对应 --branch: 指定主分支
    path: ""                          # 对应 --path: 留空全量检出
    single_file: false                # 对应 --single-file: 仓库模式
    proxy: "ghproxy"                  # 对应 --proxy: none / ghproxy / mirror / custom
    proxy_url: ""                     # 对应 --proxy-url: 自定义代理前缀
    auth_token: ""                    # 对应 --auth-token: 认证 Token
    http_proxy: ""                    # 对应 --http-proxy: HTTP/SOCKS 代理
    blacklist: "qinglong/DefaultTasks|.git|baihu/DefaultTasks/dev" # 对应 --blacklist: 过滤冗余目录
    target_path: "main"               # 相对存储目录（留空默认按 id 存入 sources/{id}）

# ==============================================================================
# 2. 原生 Shell 环境与依赖编排 (Setup) —— 拒绝死板配置，原生 Shell 极速执行
# ==============================================================================
setup:
  # [可选] 依赖快速探测：检测 dotnet 及版本是否 >= 8，满足直接秒级跳过安装
  check: |
    command -v dotnet >/dev/null 2>&1 && [ "$(dotnet --version 2>/dev/null | cut -d. -f1)" -ge 8 ]

  # [必填] 依赖安装命令：优先利用白虎面板内置的 mise 安装配置 dotnet@8，并补全系统依赖
  install: |
    echo ">> [1/2] 正在检查系统运行库依赖..."
    if command -v apt-get >/dev/null 2>&1; then
      apt-get update -qq && apt-get install -y -qq bash libicu-dev libkrb5-dev libssl-dev zlib1g-dev || true
    elif command -v apk >/dev/null 2>&1; then
      apk update && apk add -q bash icu-libs krb5-libs zlib libssl3 || true
    fi

    echo ">> [2/2] 正在配置 .NET 8 运行环境..."
    if command -v mise >/dev/null 2>&1; then
      mise install dotnet@8
      mise use -g dotnet@8
    else
      echo ">> 未检测到 mise，使用官方脚本安装 .NET 8..."
      curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 8.0
    fi
    echo ">> .NET 8 运行环境已准备就绪！"

  # [可选] 应用卸载清理
  uninstall: |
    echo ">> 正在清理构建缓存与临时文件..."
    rm -rf "{app_dir}/sources/main/src/Ray.BiliBiliTool.Console/bin" 2>/dev/null || true
    rm -rf "{app_dir}/sources/main/src/Ray.BiliBiliTool.Console/obj" 2>/dev/null || true

# ==============================================================================
# 3. 环境变量声明契约 (Env Schema) —— 驱动前端自动化渲染交互式表单
# ==============================================================================
env_schema:
  - key: "Ray_BiliBiliCookies__0"
    label: "主账号凭证 (Cookie)"
    type: "secret"
    tag: "BiliBiliToolPro"
    required: true
    description: "登录 bilibili.com 后获取的 Cookie，包含 SESSDATA、bili_jct 等字段（亦可通过扫码登录任务自动注入）"
    placeholder: "SESSDATA=xxxx; bili_jct=yyyy; DedeUserID=zzzz;"

  - key: "Ray_BiliBiliCookies__1"
    label: "账号 2 凭证 (多账号可选)"
    type: "secret"
    tag: "BiliBiliToolPro"
    required: false
    description: "多账号模式：第二个账号的 Cookie 字符串"

  - key: "Ray_DailyTaskConfig__NumberOfCoins"
    label: "每日投币数量"
    type: "select"
    tag: "BiliBiliToolPro"
    required: false
    default: "5"
    options:
      - label: "不投币 (0枚)"
        value: "0"
      - label: "保底 (1枚)"
        value: "1"
      - label: "拿满经验 (5枚)"
        value: "5"

  - key: "Ray_DailyTaskConfig__SelectLike"
    label: "投币同时点赞"
    type: "boolean"
    tag: "BiliBiliToolPro"
    default: true
    description: "投币成功后是否同时点赞视频"

  - key: "Ray_LiveLotteryTaskConfig__AutoSendDanmu"
    label: "天选抽奖自动发弹幕"
    type: "boolean"
    tag: "BiliBiliToolPro"
    default: true
    description: "遇到弹幕抽奖时是否自动发送所需弹幕"

  - key: "BaihuConfig__Token"
    label: "白虎面板 API Token"
    type: "secret"
    tag: "BiliBiliToolPro"
    required: false
    description: "白虎面板 OpenAPI 访问令牌。配置后运行【扫码登录】任务即可自动持久化 Cookie 回白虎面板！"
    placeholder: "在白虎面板【系统设置】->【OpenAPI】中创建"

  - key: "BA_URL"
    label: "白虎面板访问地址"
    type: "string"
    tag: "BiliBiliToolPro"
    required: false
    default: "http://localhost:8052"
    description: "白虎面板的内部或局域网访问地址，用于接收扫码登录成功的 Cookie 回调"

  - key: "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT"
    label: "精简容器兼容模式 (无ICU)"
    type: "boolean"
    tag: "BiliBiliToolPro"
    default: false
    description: "若精简版容器中报 Couldn't find a valid ICU package 错误，请开启此项"

# ==============================================================================
# 4. 任务生成与映射规则 (Sync Rules) —— 规则独立热更新，无须上游仓库 Git Push
# ==============================================================================
sync_rules:
  # 全局任务默认参数
  defaults:
    timeout: 30                       # 默认超时（分钟）
    retry_count: 1                    # 失败重试次数
    retry_interval: 15                # 失败重试间隔（秒）
    work_dir: "{app_dir}/sources/main/src/Ray.BiliBiliTool.Console" # 默认在 Console 工程目录运行
    language: "dotnet"                # 默认执行环境

  # 任务清单定义（解耦上游注释，标准化任务编排）
  tasks:
    - id: "charge"
      name: "大会员每月B币券充电"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Charge"
      default_cron: "0 12 * * *"
      enabled: false

    - id: "daily"
      name: "每日基础经验与投币任务"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Daily"
      default_cron: "0 9 * * *"
      enabled: true

    - id: "live_fans_medal"
      name: "直播粉丝牌亲密度打卡"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=LiveFansMedal"
      default_cron: "5 0 * * *"
      enabled: false

    - id: "live_lottery"
      name: "天选时刻高频巡检抽奖"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=LiveLottery"
      default_cron: "0 13 * * *"
      enabled: false

    - id: "login"
      name: "扫码登录 (自动持久化Cookie)"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Login"
      default_cron: "0 0 1 1 *"
      enabled: false

    - id: "manga"
      name: "漫画任务"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Manga"
      default_cron: "0 14 * * *"
      enabled: true

    - id: "manga_privilege"
      name: "大会员漫画权益领取"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=MangaPrivilege"
      default_cron: "0 15 * * *"
      enabled: true

    - id: "silver2_coin"
      name: "直播间银瓜子兑换硬币"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Silver2Coin"
      default_cron: "0 8 * * *"
      enabled: true

    - id: "test"
      name: "Cookie 有效性测试"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=Test"
      default_cron: "0 8 * * *"
      enabled: false

    - id: "try_fix"
      name: "尝试修复异常"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=TryFix"
      default_cron: "0 0 1 1 *"
      enabled: false

    - id: "unfollow_batched"
      name: "批量取关失效主播"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=UnfollowBatched"
      default_cron: "0 12 1 * *"
      enabled: false

    - id: "vip_privilege"
      name: "大会员专属福利领取"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=VipPrivilege"
      default_cron: "0 1 * * *"
      enabled: false

    - id: "vip_big_point"
      name: "大会员大积分日常任务"
      source: "main"                  # 关联代码源 ID
      command: "dotnet run -v m -- --ENVIRONMENT=Production --Ray_RunTasks=VipBigPoint"
      default_cron: "7 1 * * *"
      enabled: true

# ==============================================================================
# 5. 使用场景模板 (Scenarios) —— 赋能用户一键选配，杜绝盲目生成冗余任务
# ==============================================================================
scenarios:
  - id: "minimal"
    name: "佛系保级模式"
    description: "仅执行每日登录与基础签到，耗时极短且完全防风控，适合只需保级的账号"
    default: false
    task_presets:
        charge:
          enabled: false
        daily:
          enabled: true
        live_fans_medal:
          enabled: false
        live_lottery:
          enabled: false
        login:
          enabled: false
        manga:
          enabled: false
        manga_privilege:
          enabled: false
        silver2_coin:
          enabled: false
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: false
        vip_privilege:
          enabled: false
        vip_big_point:
          enabled: false

  - id: "standard"
    name: "标准日常满收益模式 (推荐)"
    description: "开启每日签到、自动投币、大会员大积分与漫画权益领取，最大化每日经验与收益"
    default: true
    task_presets:
        charge:
          enabled: true
        daily:
          enabled: true
        live_fans_medal:
          enabled: false
        live_lottery:
          enabled: false
        login:
          enabled: false
        manga:
          enabled: true
        manga_privilege:
          enabled: true
        silver2_coin:
          enabled: true
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: false
        vip_privilege:
          enabled: true
        vip_big_point:
          enabled: false

  - id: "hardcore"
    name: "全天候极客全能模式"
    description: "开启全部自动化功能，包括每 15 分钟一次的高频直播间天选时刻自动巡检抽奖"
    task_presets:
        charge:
          enabled: true
        daily:
          enabled: true
        live_fans_medal:
          enabled: true
        live_lottery:
          enabled: true
          cron: "*/20 * * * *"
        login:
          enabled: false
        manga:
          enabled: true
        manga_privilege:
          enabled: true
        silver2_coin:
          enabled: true
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: true
        vip_privilege:
          enabled: true
        vip_big_point:
          enabled: true
