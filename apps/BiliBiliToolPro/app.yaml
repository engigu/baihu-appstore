# ==============================================================================
# 白虎面板应用规范定义文件 (Baihu Application Specification)
# 应用名称: B站全自动化助手 (BiliBiliToolPro)
# 规范版本: v1
# 本文件由 apps/BiliBiliToolPro/build.py 自动构建生成 (请勿手动修改)
# ==============================================================================

spec_version: "v1"
id: "bilibili-tool-pro"
name: "B站全自动化助手 (BiliBiliToolPro)"
version: "4.1.1"
author: "RayWangQvQ"
category: "福利签到"
last_commit: "2026-09-29T13:19:31+08:00"
template:
  - tag: "BiliBiliToolPro"
  - mise_languages: "node@23.11.1"
description: "基于 .NET 8 的 B站多功能全自动任务工具，支持每日经验投币、大会员权益礼包领取、天选时刻抽奖、粉丝牌助手与多账号管理"
icon: "https://raw.githubusercontent.com/RayWangQvQ/BiliBiliToolPro/main/docs/images/logo.png"
homepage: "https://github.com/RayWangQvQ/BiliBiliToolPro"
build_opts:
  force_setup: true
  skip_setup: false
  skip_sync: false
schedule_opts:
  schedule: "0 0 8 * * *"
  random_range: 0
  timeout: 30
  retry_count: 0
  retry_interval: 0

# ==============================================================================
# 1. 脚本代码源列表 (Sources) —— 纯 Release 预编译模式，无需 clone 上游源码
# ==============================================================================
sources:
  - id: "main"
    source_type: "null"

# ==============================================================================
# 2. 原生 Shell 环境与依赖编排 (Setup) —— 极速拉取官方跨平台 Release 包
# ==============================================================================
setup:
  # [可选] 依赖快速探测：已就绪时毫秒级跳过安装
  check: "node -e \"const fs=require('fs'), p=require('path'); const bin=p.join(process.env.APP_DIR||process.cwd(),'bin'); if(!fs.existsSync(p.join(bin,'Ray.BiliBiliTool.Console')) && !fs.existsSync(p.join(bin,'Ray.BiliBiliTool.Console.exe'))){process.exit(1)}\""

  # [必填] 依赖安装命令：根据当前操作系统架构拉取对应的官方 Release zip 并解压到 bin 目录
  install: |
    node -e "
    const fs = require('fs');
    const path = require('path');
    const https = require('https');
    const http = require('http');
    const zlib = require('zlib');
    const { execSync } = require('child_process');

    const appDir = process.env.APP_DIR || process.cwd();
    const binDir = path.join(appDir, 'bin');
    fs.mkdirSync(binDir, { recursive: true });

    let osName = process.platform === 'win32' ? 'win' : (process.platform === 'darwin' ? 'osx' : 'linux');
    let archName = process.arch === 'arm64' ? 'arm64' : (process.arch === 'arm' ? 'arm' : 'x64');

    const version = '4.1.1';
    const tag = '4.1.1';
    const zipName = 'bilibili-tool-pro-v' + version + '-' + osName + '-' + archName + '.zip';
    const rawUrl = 'https://github.com/RayWangQvQ/BiliBiliToolPro/releases/download/' + tag + '/' + zipName;

    const mirrors = [
      'https://gh-proxy.com/' + rawUrl,
      'https://ghfast.top/' + rawUrl,
      'https://ghproxy.net/' + rawUrl,
      rawUrl
    ];

    const tempZip = path.join(binDir, 'temp_release.zip');

    function downloadFile(url) {
      return new Promise((resolve, reject) => {
        const client = url.startsWith('https') ? https : http;
        const req = client.get(url, { headers: { 'User-Agent': 'BaihuApp-Downloader' } }, (res) => {
          if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
            return resolve(downloadFile(res.headers.location));
          }
          if (res.statusCode !== 200) {
            return reject(new Error('HTTP status ' + res.statusCode));
          }
          const fileStream = fs.createWriteStream(tempZip);
          res.pipe(fileStream);
          fileStream.on('finish', () => {
            fileStream.close(() => resolve(true));
          });
        });
        req.on('error', reject);
        req.setTimeout(30000, () => { req.destroy(); reject(new Error('Timeout')); });
      });
    }

    function extractZip(zipPath, targetDir) {
      try {
        const buf = fs.readFileSync(zipPath);
        let pos = 0;
        let count = 0;
        while (pos < buf.length - 30) {
          if (buf.readUInt32LE(pos) === 0x04034b50) {
            const method = buf.readUInt16LE(pos + 8);
            const compSize = buf.readUInt32LE(pos + 18);
            const fnLen = buf.readUInt16LE(pos + 26);
            const extraLen = buf.readUInt16LE(pos + 28);
            const fn = buf.toString('utf8', pos + 30, pos + 30 + fnLen);
            const dataStart = pos + 30 + fnLen + extraLen;
            const data = buf.slice(dataStart, dataStart + compSize);
            pos = dataStart + compSize;

            const targetPath = path.join(targetDir, fn);
            if (fn.endsWith('/') || fn.endsWith('\\\\')) {
              fs.mkdirSync(targetPath, { recursive: true });
            } else {
              fs.mkdirSync(path.dirname(targetPath), { recursive: true });
              const content = method === 8 ? zlib.inflateRawSync(data) : data;
              fs.writeFileSync(targetPath, content);
              count++;
            }
          } else {
            pos++;
          }
        }
        if (count > 0) return true;
      } catch (_) {}

      const tryCommands = [
        'python3 -m zipfile -e \"' + zipPath + '\" \"' + targetDir + '\"',
        'python -m zipfile -e \"' + zipPath + '\" \"' + targetDir + '\"',
        'unzip -o -q \"' + zipPath + '\" -d \"' + targetDir + '\"',
        'tar -xf \"' + zipPath + '\" -C \"' + targetDir + '\"',
        'powershell -Command \"Expand-Archive -Path \\\"' + zipPath + '\\\" -DestinationPath \\\"' + targetDir + '\\\" -Force\"'
      ];
      for (const cmd of tryCommands) {
        try {
          execSync(cmd, { stdio: 'ignore' });
          return true;
        } catch (_) {}
      }
      throw new Error('解压失败，未找到可用解压工具');
    }

    async function main() {
      console.log('>> 正在匹配系统架构: ' + osName + '-' + archName + ', 下载 Release 产物: ' + zipName);
      let downloaded = false;
      for (const m of mirrors) {
        try {
          console.log('>> 尝试下载源: ' + m);
          await downloadFile(m);
          if (fs.existsSync(tempZip) && fs.statSync(tempZip).size > 1000) {
            downloaded = true;
            console.log('>> 下载成功，文件大小: ' + fs.statSync(tempZip).size + ' 字节');
            break;
          }
        } catch (e) {
          console.log('>> 下载失败: ' + e.message + '，尝试下一镜像...');
          if (fs.existsSync(tempZip)) fs.unlinkSync(tempZip);
        }
      }

      if (!downloaded) {
        console.error('>> 所有镜像源下载失败！');
        process.exit(1);
      }

      console.log('>> 正在解压 Release 包到 ' + binDir + '...');
      try {
        extractZip(tempZip, binDir);
      } catch (e) {
        console.error('>> 解压失败: ' + e.message);
        process.exit(1);
      } finally {
        if (fs.existsSync(tempZip)) fs.unlinkSync(tempZip);
      }

      const execFile = path.join(binDir, 'Ray.BiliBiliTool.Console');
      if (fs.existsSync(execFile)) {
        try { fs.chmodSync(execFile, 0o755); } catch (_) {}
      }

      console.log('>> BiliBiliToolPro 预编译包准备就绪！');
    }

    main().catch(err => {
      console.error('>> 部署异常: ' + err.message);
      process.exit(1);
    });
    "

  # [可选] 后置初始化命令：安装成功后自动执行
  post_install: |
    echo ">> 后置初始化准备就绪！"

  # [可选] 应用卸载清理
  uninstall: |
    node -e "['bin'].forEach(p => require('fs').rmSync((process.env.APP_DIR || process.cwd()) + '/' + p, {recursive: true, force: true}))"

# ==============================================================================
# 3. 环境变量声明契约 (Env Schema) —— 驱动前端自动化渲染交互式表单
# ==============================================================================
env_schema:
  - key: "Ray_BiliBiliCookies__0"
    label: "主账号凭证 (Cookie)"
    type: "string"
    required: true
    description: "登录 bilibili.com 后获取的 Cookie，包含 SESSDATA、bili_jct 等字段（亦可通过扫码登录任务自动注入）"
    placeholder: "SESSDATA=xxxx; bili_jct=yyyy; DedeUserID=zzzz;"

  - key: "Ray_DailyTaskConfig__NumberOfCoins"
    label: "每日投币数量"
    type: "select"
    required: false
    default: "5"
    options:
      - label: "不投币 (0枚)"
        value: "0"
      - label: "保底 (1枚)"
        value: "1"
      - label: "拿满经验 (5枚)"
        value: "5"

  - key: "Ray_DailyTaskConfig__SelectLike"
    label: "投币同时点赞"
    type: "boolean"
    default: true
    description: "投币成功后是否同时点赞视频"

  - key: "Ray_LiveLotteryTaskConfig__AutoSendDanmu"
    label: "天选抽奖自动发弹幕"
    type: "boolean"
    default: true
    description: "遇到弹幕抽奖时是否自动发送所需弹幕"

  - key: "BaihuConfig__Token"
    label: "白虎面板 API Token"
    type: "string"
    required: false
    description: "白虎面板 OpenAPI 访问令牌。配置后运行【扫码登录】任务即可自动持久化 Cookie 回白虎面板！"
    placeholder: "在白虎面板【系统设置】->【OpenAPI】中创建"

  - key: "BA_URL"
    label: "白虎面板访问地址"
    type: "string"
    required: false
    default: "http://localhost:8052"
    description: "白虎面板的内部或局域网访问地址，用于接收扫码登录成功的 Cookie 回调"

  - key: "Ray_PlatformType"
    label: "运行平台类型"
    type: "string"
    required: false
    default: "Baihu"
    description: "指定底层运行平台为 Baihu，完全复刻青龙/白虎原生调度行为，实现扫码登录后自动将 Cookie 同步保存回面板"

  - key: "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT"
    label: "精简容器兼容模式 (无ICU)"
    type: "boolean"
    default: true
    description: "解决精简容器/系统环境下缺失 libicu 导致的初始化问题"

# ==============================================================================
# 4. 任务生成与映射规则 (Sync Rules) —— 规则独立热更新，无须上游仓库 Git Push
# ==============================================================================
sync_rules:
  # 全局任务默认参数
  defaults:
    timeout: 30                       # 默认超时（分钟）
    retry_count: 1                    # 失败重试次数
    retry_interval: 15                # 失败重试间隔（秒）
    work_dir: "{app_dir}/bin"         # 运行已解压的产物目录，实现 0.1 秒极速启动
    language: "{mise_languages}"      # 执行环境锁定为 {mise_languages}

  # 任务清单定义（解耦上游注释，标准化任务编排）
  tasks:
    - id: "daily"
      name: "每日基础经验与投币任务"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=Daily"
      default_cron: "0 0 9 * * *"
      enabled: true

    - id: "login"
      name: "扫码登录 (自动持久化Cookie)"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=Login"
      default_cron: "0 0 1 1 *"
      enabled: false

    - id: "live_lottery"
      name: "天选时刻高频巡检抽奖"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=LiveLottery"
      default_cron: "*/15 * * * *"
      enabled: false

    - id: "manga"
      name: "漫画权益自动领取"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=Manga"
      default_cron: "0 30 10 * * *"
      enabled: true

    - id: "silver2coin"
      name: "直播间银瓜子兑换硬币"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=Silver2Coin"
      default_cron: "0 5 0 * * *"
      enabled: true

    - id: "vip_bigpoint"
      name: "大会员大积分日常任务"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=VipBigPoint"
      default_cron: "0 15 1 * * *"
      enabled: true

    - id: "charge"
      name: "大会员每月B币券充电"
      source: "main"
      language: "{mise_languages}"
      command: "./Ray.BiliBiliTool.Console --ENVIRONMENT=Production --runTasks=Charge"
      default_cron: "0 0 12 28 * *"
      enabled: false

# ==============================================================================
# 5. 使用场景模板 (Scenarios) —— 赋能用户一键选配，杜绝盲目生成冗余任务
# ==============================================================================
scenarios:
  - id: "minimal"
    name: "佛系保级模式"
    description: "仅执行每日登录与基础签到，耗时极短且完全防风控，适合只需保级的账号"
    default: false
    task_presets:
        daily:
          enabled: true
        login:
          enabled: false
        live_lottery:
          enabled: false
        manga:
          enabled: false
        silver2coin:
          enabled: false
        vip_bigpoint:
          enabled: false
        charge:
          enabled: false

  - id: "standard"
    name: "标准日常满收益模式 (推荐)"
    description: "开启每日签到、自动投币、大会员大积分与漫画权益领取，最大化每日经验与收益"
    default: true
    task_presets:
        daily:
          enabled: true
        login:
          enabled: false
        live_lottery:
          enabled: false
        manga:
          enabled: true
        silver2coin:
          enabled: true
        vip_bigpoint:
          enabled: true
        charge:
          enabled: true

  - id: "hardcore"
    name: "全天候极客全能模式"
    description: "开启全部自动化功能，包括每 15 分钟一次的高频直播间天选时刻自动巡检抽奖"
    task_presets:
        daily:
          enabled: true
        login:
          enabled: false
        live_lottery:
          enabled: true
          cron: "0 */20 * * * *"
        manga:
          enabled: true
        silver2coin:
          enabled: true
        vip_bigpoint:
          enabled: true
        charge:
          enabled: true
