# ==============================================================================
# 白虎面板应用规范定义文件 (Baihu Application Specification)
# 应用名称: B站全自动化助手 (BiliBiliToolPro)
# 规范版本: v1
# 本文件由 apps/BiliBiliToolPro/build.py 自动构建生成 (请勿手动修改)
# ==============================================================================

spec_version: "v1"
id: "bilibili-tool-pro"
name: "B站全自动化助手 (BiliBiliToolPro)"
version: "2.1.0"
author: "RayWangQvQ"
category: "福利签到"
last_commit: "2026-09-22T01:47:16+08:00"
template:
  - tag: "BiliBiliToolPro"
  - mise_languages: "dotnet@10.0.401"
description: "基于 .NET 8 的 B站多功能全自动任务工具，支持每日经验投币、大会员权益礼包领取、天选时刻抽奖、粉丝牌助手与多账号管理"
icon: "https://raw.githubusercontent.com/RayWangQvQ/BiliBiliToolPro/main/docs/images/logo.png"
homepage: "https://github.com/RayWangQvQ/BiliBiliToolPro"
build_opts:
  force_setup: true
  skip_setup: false
  skip_sync: false
schedule_opts:
  schedule: "0 0 8 * * *"
  random_range: 0
  timeout: 30
  retry_count: 0
  retry_interval: 0

# ==============================================================================
# 1. 脚本代码源列表 (Sources) —— 支持定义多个源，100% 复用 baihu reposync 参数规范
# ==============================================================================
# 支持配置多个独立的代码源（例如：主业务仓库 + 外部公共工具库 + 单文件补丁直链）
# 单源场景下亦支持使用单个 source: { ... } 对象，系统自动兼容处理
sources:
  - id: "main"                        # [必填] 源唯一标识符（在下方 tasks 中通过 source: "main" 关联）
    source_type: "git"                # 对应 --source-type: git (Git仓库) 或 url (单文件下载)
    source_url: "https://github.com/RayWangQvQ/BiliBiliToolPro.git" # 对应 --source-url: 上游开源项目地址
    branch: "main"       # 对应 --branch: 指定主分支
    path: ""                          # 对应 --path: 留空全量检出
    single_file: false                # 对应 --single-file: 仓库模式
    proxy: "ghproxy"                  # 对应 --proxy: none / ghproxy / mirror / custom
    proxy_url: ""                     # 对应 --proxy-url: 自定义代理前缀
    auth_token: ""                    # 对应 --auth-token: 认证 Token
    http_proxy: ""                    # 对应 --http-proxy: HTTP/SOCKS 代理
    blacklist: "qinglong/DefaultTasks|.git|baihu/DefaultTasks/dev" # 对应 --blacklist: 过滤冗余目录
    target_path: "main"               # 相对存储目录（留空默认按 id 存入 sources/{id}）

# ==============================================================================
# 2. 原生 Shell 环境与依赖编排 (Setup) —— 拒绝死板配置，原生 Shell 极速执行
# ==============================================================================
setup:
  # [可选] 依赖快速探测：已就绪时毫秒级跳过安装
  check: "mise exec {mise_languages} -- dotnet --version"

  # [必填] 依赖安装命令：安装 {mise_languages} 并一次性预编译到 bin 目录，彻底避免每次任务重复 build
  install: |
    mise install {mise_languages}
    echo ">> 正在使用 {mise_languages} 预编译 BiliBiliToolPro (Release)..."
    mise exec {mise_languages} -- dotnet publish -c Release -o "{app_dir}/bin" "{app_dir}/main/src/Ray.BiliBiliTool.Console/Ray.BiliBiliTool.Console.csproj"
    echo ">> 预编译就绪，运行时将 0.1s 极速启动！"

  # [可选] 后置初始化命令：编译成功后自动执行的后置 Shell 脚本
  post_install: |
    echo ">> 后置初始化准备就绪！"

  # [可选] 应用卸载清理
  uninstall: |
    mise exec {mise_languages} -- node -e "['bin','main/src/Ray.BiliBiliTool.Console/obj'].forEach(p => require('fs').rmSync('{app_dir}/'+p, {recursive: true, force: true}))"

# ==============================================================================
# 3. 环境变量声明契约 (Env Schema) —— 驱动前端自动化渲染交互式表单
# ==============================================================================
env_schema:
  - key: "Ray_BiliBiliCookies__0"
    label: "主账号凭证 (Cookie)"
    type: "secret"
    tag: "{tag}"
    required: true
    description: "登录 bilibili.com 后获取的 Cookie，包含 SESSDATA、bili_jct 等字段（亦可通过扫码登录任务自动注入）"
    placeholder: "SESSDATA=xxxx; bili_jct=yyyy; DedeUserID=zzzz;"

  - key: "Ray_BiliBiliCookies__1"
    label: "账号 2 凭证 (多账号可选)"
    type: "secret"
    tag: "{tag}"
    required: false
    description: "多账号模式：第二个账号的 Cookie 字符串"

  - key: "Ray_DailyTaskConfig__NumberOfCoins"
    label: "每日投币数量"
    type: "select"
    tag: "{tag}"
    required: false
    default: "5"
    options:
      - label: "不投币 (0枚)"
        value: "0"
      - label: "保底 (1枚)"
        value: "1"
      - label: "拿满经验 (5枚)"
        value: "5"

  - key: "Ray_DailyTaskConfig__SelectLike"
    label: "投币同时点赞"
    type: "boolean"
    tag: "{tag}"
    default: true
    description: "投币成功后是否同时点赞视频"

  - key: "Ray_LiveLotteryTaskConfig__AutoSendDanmu"
    label: "天选抽奖自动发弹幕"
    type: "boolean"
    tag: "{tag}"
    default: true
    description: "遇到弹幕抽奖时是否自动发送所需弹幕"

  - key: "BaihuConfig__Token"
    label: "白虎面板 API Token"
    type: "secret"
    tag: "{tag}"
    required: false
    description: "白虎面板 OpenAPI 访问令牌。配置后运行【扫码登录】任务即可自动持久化 Cookie 回白虎面板！"
    placeholder: "在白虎面板【系统设置】->【OpenAPI】中创建"

  - key: "BA_URL"
    label: "白虎面板访问地址"
    type: "string"
    tag: "{tag}"
    required: false
    default: "http://localhost:8052"
    description: "白虎面板的内部或局域网访问地址，用于接收扫码登录成功的 Cookie 回调"

  - key: "Ray_PlatformType"
    label: "运行平台类型"
    type: "string"
    tag: "{tag}"
    required: false
    default: "Baihu"
    description: "指定底层运行平台为 Baihu，完全复刻青龙/白虎原生调度行为，实现扫码登录后自动将 Cookie 同步保存回面板"

  - key: "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT"
    label: "精简容器兼容模式 (无ICU)"
    type: "boolean"
    tag: "{tag}"
    default: true
    description: "复刻 bili_task_base.sh 中的全局环境变量，解决跨平台与精简容器中 ICU 异常"

# ==============================================================================
# 4. 任务生成与映射规则 (Sync Rules) —— 规则独立热更新，无须上游仓库 Git Push
# ==============================================================================
sync_rules:
  # 全局任务默认参数
  defaults:
    timeout: 30                       # 默认超时（分钟）
    retry_count: 1                    # 失败重试次数
    retry_interval: 15                # 失败重试间隔（秒）
    work_dir: "{app_dir}/bin"         # 运行已编译的产物目录，实现 0.1 秒极速启动
    language: "{mise_languages}"              # 执行环境全部锁定为 {mise_languages}

  # 任务清单定义（解耦上游注释，标准化任务编排）
  tasks:
    - id: "charge"
      name: "大会员每月B币券充电"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Charge"
      default_cron: "0 0 12 * * *"
      enabled: false

    - id: "daily"
      name: "每日基础经验与投币任务"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Daily"
      default_cron: "0 0 9 * * *"
      enabled: true

    - id: "live_fans_medal"
      name: "直播粉丝牌亲密度打卡"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=LiveFansMedal"
      default_cron: "0 5 0 * * *"
      enabled: false

    - id: "live_lottery"
      name: "天选时刻高频巡检抽奖"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=LiveLottery"
      default_cron: "0 0 13 * * *"
      enabled: false

    - id: "login"
      name: "扫码登录 (自动持久化Cookie)"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Login"
      default_cron: "0 0 0 1 1 *"
      enabled: false

    - id: "manga"
      name: "漫画任务"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Manga"
      default_cron: "0 0 14 * * *"
      enabled: true

    - id: "manga_privilege"
      name: "大会员漫画权益领取"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=MangaPrivilege"
      default_cron: "0 0 15 * * *"
      enabled: true

    - id: "silver2_coin"
      name: "直播间银瓜子兑换硬币"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Silver2Coin"
      default_cron: "0 0 8 * * *"
      enabled: true

    - id: "test"
      name: "Cookie 有效性测试"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=Test"
      default_cron: "0 0 8 * * *"
      enabled: false

    - id: "try_fix"
      name: "清理缓存并重新预编译 (尝试修复异常)"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "rm -rf '{app_dir}/bin' 2>/dev/null || true; dotnet publish -c Release -o '{app_dir}/bin' '{app_dir}/main/src/Ray.BiliBiliTool.Console/Ray.BiliBiliTool.Console.csproj' && echo '>> 缓存清理与重新编译就绪！'"
      default_cron: "0 0 0 1 1 *"
      enabled: false

    - id: "unfollow_batched"
      name: "批量取关失效主播"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=UnfollowBatched"
      default_cron: "0 0 12 1 * *"
      enabled: false

    - id: "vip_big_point"
      name: "大会员大积分日常任务"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=VipBigPoint"
      default_cron: "0 7 1 * * *"
      enabled: true

    - id: "vip_privilege"
      name: "大会员专属福利领取"
      source: "main"                  # 关联代码源 ID
      tag: "{tag}"
      language: "{mise_languages}"            # 运行时锁定 {mise_languages}
      command: "dotnet Ray.BiliBiliTool.Console.dll --ENVIRONMENT=Production --runTasks=VipPrivilege"
      default_cron: "0 0 1 * * *"
      enabled: false

# ==============================================================================
# 5. 使用场景模板 (Scenarios) —— 赋能用户一键选配，杜绝盲目生成冗余任务
# ==============================================================================
scenarios:
  - id: "minimal"
    name: "佛系保级模式"
    description: "仅执行每日登录与基础签到，耗时极短且完全防风控，适合只需保级的账号"
    default: false
    task_presets:
        charge:
          enabled: false
        daily:
          enabled: true
        live_fans_medal:
          enabled: false
        live_lottery:
          enabled: false
        login:
          enabled: false
        manga:
          enabled: false
        manga_privilege:
          enabled: false
        silver2_coin:
          enabled: false
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: false
        vip_big_point:
          enabled: false
        vip_privilege:
          enabled: false

  - id: "standard"
    name: "标准日常满收益模式 (推荐)"
    description: "开启每日签到、自动投币、大会员大积分与漫画权益领取，最大化每日经验与收益"
    default: true
    task_presets:
        charge:
          enabled: true
        daily:
          enabled: true
        live_fans_medal:
          enabled: false
        live_lottery:
          enabled: false
        login:
          enabled: false
        manga:
          enabled: true
        manga_privilege:
          enabled: true
        silver2_coin:
          enabled: true
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: false
        vip_big_point:
          enabled: false
        vip_privilege:
          enabled: true

  - id: "hardcore"
    name: "全天候极客全能模式"
    description: "开启全部自动化功能，包括每 15 分钟一次的高频直播间天选时刻自动巡检抽奖"
    task_presets:
        charge:
          enabled: true
        daily:
          enabled: true
        live_fans_medal:
          enabled: true
        live_lottery:
          enabled: true
          cron: "0 */20 * * * *"
        login:
          enabled: false
        manga:
          enabled: true
        manga_privilege:
          enabled: true
        silver2_coin:
          enabled: true
        test:
          enabled: false
        try_fix:
          enabled: false
        unfollow_batched:
          enabled: true
        vip_big_point:
          enabled: true
        vip_privilege:
          enabled: true
