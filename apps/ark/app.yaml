# ==============================================================================
# 白虎面板应用规范定义文件 (Baihu Application Specification)
# 应用名称: Ark 班轮货运管理终端
# 规范版本: v1
# 本文件由 apps/ark/build.py 自动构建生成 (请勿手动修改)
# ==============================================================================

spec_version: "v1"
id: "ark"
name: "Ark 班轮货运管理终端"
version: "1.0.0"
author: "duorameng"
category: "系统工具"
last_commit: "2026-09-16T00:00:00+08:00"
template:
  - tag: "Ark"
  - mise_languages: "go@1.22.5"
description: "基于 OCI 标准协议与 Golang 独立单二进制的云端工作负载快照交付与分布式工作区同步系统，支持 AES-256 加密封条与极速分层增量直推。"
icon: "https://raw.githubusercontent.com/duorameng/ark/main/docs/images/logo.png"
homepage: "https://github.com/duorameng/ark"

sources:
  - id: "main"
    source_type: "git"
    source_url: "https://github.com/duorameng/ark.git"
    branch: "main"
    path: ""
    single_file: false
    proxy: "ghproxy"
    target_path: "main"

setup:
  check: "mise exec {mise_languages} -- go version"
  install: |-
    mise install {mise_languages}
    echo ">> 正在为 Ark 编译 Go 独立单二进制程序..."
    cd "{app_dir}/main" && mise exec {mise_languages} -- go build -ldflags="-s -w" -o "{app_dir}/bin/ark" .
    echo ">> Ark 编译与部署就绪！"
  uninstall: "node -e \"try{require('fs').rmSync('{app_dir}/bin/ark',{force:true})}catch(e){}\""

env_schema:
  - key: "ARK_BACKUP_DIR"
    label: "工作区源路径 (ARK_BACKUP_DIR)"
    type: "normal"
    tag: "{tag}"
    required: true
    description: "需要备份与同步的工作区根目录路径（如 /root/workspace）"
    placeholder: "/root/workspace"
  - key: "ARK_SEAL_KEY"
    label: "AES-256 封条加密口令"
    type: "secret"
    tag: "{tag}"
    required: false
    description: "端到端 AES-256-CBC 封条自定义加密口令"
    placeholder: "YourSecretKey"
  - key: "ARK_REGISTRY_TYPE"
    label: "目标注册表通道 (ali/gh/both)"
    type: "normal"
    tag: "{tag}"
    required: false
    default: "gh"
    description: "远端镜像注册表类型 (gh: GitHub Packages, ali: 阿里云 ACR, both: 双推)"
    placeholder: "gh"
  - key: "ARK_REPOSITORY"
    label: "目标镜像仓库路径"
    type: "normal"
    tag: "{tag}"
    required: false
    description: "目标 OCI 镜像仓库全路径（如 ghcr.io/duorameng/ark）"
    placeholder: "ghcr.io/duorameng/ark"

tasks:
  - id: "ark_check"
    name: "环境与密钥就绪自检"
    source: "main"
    command: "{app_dir}/bin/ark check"
    default_cron: "0 0 8 * * *"
    enabled: true
    remark: "自检权限、配置、密钥加密与网络连通闭环"
  - id: "ark_board"
    name: "每日增量快照打包登船交付"
    source: "main"
    command: "{app_dir}/bin/ark board --day --auto-scan"
    default_cron: "0 0 2 * * *"
    enabled: true
    remark: "全自动探测变更，按天打标并分层增量推送至云端注册表"
  - id: "ark_dry"
    name: "模拟演练与全量校验 (Dry Run)"
    source: "main"
    command: "{app_dir}/bin/ark dry"
    default_cron: "0 0 12 * * *"
    enabled: false
    remark: "模拟分层打包与冷热度排序验证，不产生真实网络推流"

scenarios:
  - id: "standard"
    name: "标准自动打包备份模式"
    description: "启用每日定时快照登船交付与环境健康度自检"
    default: true
    task_presets:
      ark_check:
        enabled: true
      ark_board:
        enabled: true
      ark_dry:
        enabled: false
  - id: "minimal"
    name: "仅环境自检模式"
    description: "仅保留基础状态检测，挂起定时打包"
    default: false
    task_presets:
      ark_check:
        enabled: true
      ark_board:
        enabled: false
      ark_dry:
        enabled: false
