spec_version: v1
id: jdpro
name: 京东全功能自动化助手 (JDPro)
version: 1.0.0
author: 6dylan6
category: 福利签到
last_commit: '2026-09-16T09:22:12+08:00'
template:
- tag: JDPro
- mise_languages: node@23.11.1
description: 基于 Node.js 的京东自动化全功能任务集合，动态包含 52 个福利任务，支持资产变动通知、东东农场、汪汪庄园、店铺签到、签到提现等
icon: https://img10.360buyimg.com/img/jfs/t1/158580/38/20042/13936/6090f4e3E06b86cf0/64dd78b273d6b05e.png
homepage: https://github.com/6dylan6/jdpro
sources:
- id: main
  source_type: git
  source_url: https://github.com/6dylan6/jdpro.git
  branch: main
  path: ''
  single_file: false
  proxy: ghproxy
  target_path: main
setup:
  check: mise exec {mise_languages} -- node -e "if (!process.version.startsWith('v23')) process.exit(1)"
  install: |-
    mise install {mise_languages}
    echo ">> 正在为 JDPro 设置 registry 镜像并清理旧 lockfile..."
    cd "{app_dir}/main" && mise exec {mise_languages} -- npm config set registry https://registry.npmmirror.com/
    cd "{app_dir}/main" && mise exec {mise_languages} -- node -e "try{require('fs').unlinkSync('package-lock.json')}catch(e){}"
    echo ">> 正在安装 JDPro 基础 Node.js 依赖..."
    cd "{app_dir}/main" && mise exec {mise_languages} -- npm install got@11.8.6 ds@2.0.2 png-js@1.0.0 date-fns@3.6.0 axios@1.7.4 crypto-js@4.2.0 request@2.88.2 jsdom@24.1.1 moment@2.30.1 cheerio@1.0.0 https-proxy-agent@7.0.5 tough-cookie tunnel dotenv qrcode-terminal tslib typescript --legacy-peer-deps --no-audit --no-fund --omit=dev
    echo ">> 正在执行 JDPro 依赖补全脚本 (jd_indeps.js)..."
    cd "{app_dir}/main" && mise exec {mise_languages} -- node jd_indeps.js
    echo ">> JDPro 依赖就绪！"
  uninstall: mise exec {mise_languages} -- node -e "try{require('fs').rmSync('{app_dir}/main/node_modules',{recursive:true,force:true})}catch(e){}"
env_schema:
- key: JD_COOKIE
  label: 京东账号凭证 (Cookie)
  type: secret
  tag: '{tag}'
  required: true
  description: 京东账号 Pt_Key 与 Pt_Pin 凭证，格式为 pt_key=xxx;pt_pin=yyy;（多账号可用 & 分隔）
  placeholder: pt_key=AAJxxx; pt_pin=jd_123456;
- key: PUSH_KEY
  label: Server酱 PUSH_KEY
  type: secret
  tag: '{tag}'
  required: false
  description: Server酱微信推送 Key，用于接收资产变动与通知
- key: BARK_PUSH
  label: Bark 推送地址
  type: string
  tag: '{tag}'
  required: false
  description: iOS Bark 推送服务地址/Key
- key: QYWX_AM
  label: 企业微信应用推送
  type: secret
  tag: '{tag}'
  required: false
  description: 企业微信应用消息推送参数
- key: TG_BOT_TOKEN
  label: Telegram Bot Token
  type: secret
  tag: '{tag}'
  required: false
  description: Telegram 机器人 Token
- key: TG_USER_ID
  label: Telegram User ID
  type: string
  tag: '{tag}'
  required: false
  description: Telegram 用户 ID
