name: Build & Deploy Baihu AppStore
 
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/**'
      - 'build-all.py'
      - 'requirements.txt'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/**'
      - 'build-all.py'
      - 'requirements.txt'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
    inputs:
      panel_branch:
        description: 'baihu-panel 验证分支'
        required: false
        default: 'main'
        type: string
  schedule:
    # 每天北京时间早晨 8:00 (UTC 0:00) 自动同步构建上游规则
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 步骤 1: 扫描所有 app 并单次编译 Baihu CLI 二进制供所有矩阵节点共享
  prepare:
    name: Prepare App Matrix & Build CLI
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4

      - name: Generate Matrix Config
        id: set-matrix
        run: |
          APPS=$(python3 -c 'import os, json; print(json.dumps([os.path.join("apps", d, "app.yaml") for d in os.listdir("apps") if os.path.isfile(os.path.join("apps", d, "app.yaml"))]))')
          echo "matrix={\"app\": $APPS}" >> $GITHUB_OUTPUT

      - name: Download Latest Baihu Release Binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ">> 正在从 engigu/baihu-panel 下载最新官方 Release 预编译产物..."
          gh release download --repo engigu/baihu-panel --pattern "baihu-linux-amd64.tar.gz" --output baihu-linux-amd64.tar.gz
          tar -xzf baihu-linux-amd64.tar.gz
          if [ -f baihu-linux-amd64 ]; then mv baihu-linux-amd64 baihu; fi
          chmod +x ./baihu
          echo ">> 白虎 CLI 二进制准备就绪！"
          ./baihu --version || ./baihu -v || true

      - name: Upload Baihu CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baihu-cli-binary
          path: ./baihu

  # 步骤 2: 矩阵并行对每个应用运行 CLI 硬核验证 (仅需下载编译好的 CLI，无重复编译)
  validate:
    name: Validate (${{ matrix.app }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4

      - name: Download Baihu CLI Binary
        uses: actions/download-artifact@v4
        with:
          name: baihu-cli-binary
          path: ./

      - name: Ensure CLI Executable
        run: chmod +x ./baihu

      - name: Install Mise CLI
        uses: jdx/mise-action@v2

      - name: Dry-Run App Deployment with SQLite
        run: |
          export DB_TYPE="sqlite"
          export DB_DSN="./baihu_ci_test.db"
          echo "=================================================="
          echo ">> 正在对应用进行矩阵并行硬核部署测试: ${{ matrix.app }}"
          echo "=================================================="
          ./baihu app apply "${{ matrix.app }}" --force-setup

      - name: Smoke-Test Installed Task with Baihu CLI
        run: |
          export DB_TYPE="sqlite"
          export DB_DSN="./baihu_ci_test.db"

          echo "=================================================="
          echo ">> 启动轻量白虎后台服务进行任务原生测试"
          echo "=================================================="
          ./baihu server &
          SERVER_PID=$!

          # 轮询探测后台服务是否就绪
          for i in {1..15}; do
            if ./baihu task list >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # 输出当前已安装任务清单
          echo ">> 当前已安装任务列表:"
          ./baihu task list

          # 从 ./baihu task list 输出中智能提取已安装的受控子任务 ID (优先选取启用的 task)
          TASK_ID=$(./baihu task list 2>/dev/null | grep -E "\|\s*task\s*\|\s*启用" | head -n 1 | awk '{print $1}')
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(./baihu task list 2>/dev/null | grep -E "\|\s*task\s*\|" | head -n 1 | awk '{print $1}')
          fi

          if [ -n "$TASK_ID" ]; then
            echo "=================================================="
            echo ">> 智能选定已安装任务 ID: $TASK_ID"
            echo ">> 通过白虎原生 CLI 触发任务执行: ./baihu task run $TASK_ID"
            echo "=================================================="
            ./baihu task run "$TASK_ID"

            # 轮询等待任务产生执行日志 (最多等待 15 秒)
            echo ">> 正在等待任务执行并回显日志..."
            STATUS_OUTPUT=""
            for i in {1..15}; do
              sleep 1
              STATUS_OUTPUT=$(./baihu task status "$TASK_ID" 2>&1 || true)
              if echo "$STATUS_OUTPUT" | grep -q "日志记录:"; then
                if ! echo "$STATUS_OUTPUT" | grep -q "最终状态: 运行中"; then
                  break
                fi
              fi
            done

            echo ">> [白虎原生任务执行状态与日志详情]:"
            echo "$STATUS_OUTPUT"

            # 核心判定：只抓基本文件缺失或命令不存在的系统级故障，业务逻辑报错安全放行
            if echo "$STATUS_OUTPUT" | grep -Eiq "couldn't exec process: No such file|No such file or directory|command not found|Cannot find module|not found in \$PATH|Permission denied"; then
              echo "==================================================" >&2
              echo "[FATAL] 任务健全性校验失败：检测到可执行文件或入口脚本缺失！" >&2
              echo "==================================================" >&2
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi

            echo "=================================================="
            echo ">> ✓ 任务已成功拉起运行！基本文件完备 (业务层报错已正常忽略)"
            echo "=================================================="
          else
            echo ">> 提示: 当前应用未注册受控子任务，跳过单任务测试。"
          fi

          # 优雅关闭测试 server
          kill $SERVER_PID 2>/dev/null || true

  # 步骤 3: 校验全部通过后，构建索引、提交代码并部署 Pages
  build:
    name: Build All & Package
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Global AppStore Builder
        run: |
          python build-all.py --branch "${GITHUB_REF_NAME:-main}"

      - name: Commit and Push Changes (Push & Dispatch Only)
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/ apps.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-build): 自动构建更新应用清单与全局索引 [skip ci]"
            TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "$TARGET_BRANCH"
          else
            echo ">> 没有检测到应用清单变动，无需推送提交。"
          fi

      - name: Prepare Pages Artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          mkdir -p _site
          cp apps.json _site/
          mkdir -p _site/apps
          cp -r apps/* _site/apps/ 2>/dev/null || true

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appstore-dist
          path: |
            apps.json
            apps/**/app.yaml

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge jsDelivr CDN Cache
        run: |
          echo ">> 正在强刷 jsDelivr CDN 全球节点缓存..."
          curl -s "https://purge.jsdelivr.net/gh/engigu/baihu-appstore@${GITHUB_REF_NAME:-main}/apps.json" || true


