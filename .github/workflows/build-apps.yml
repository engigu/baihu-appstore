name: Build & Deploy Baihu AppStore
 
on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'build-all.py'
      - 'requirements.txt'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      panel_branch:
        description: 'baihu-panel 验证分支'
        required: false
        default: 'main'
        type: string
  schedule:
    # 每天北京时间早晨 8:00 (UTC 0:00) 自动同步构建上游规则
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build All Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Global AppStore Builder
        run: |
          python build-all.py

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Checkout Baihu Panel Engine
        uses: actions/checkout@v4
        with:
          repository: 'engigu/baihu-panel'
          ref: ${{ github.event.inputs.panel_branch || 'main' }}
          path: 'baihu-panel-src'

      - name: Build Baihu CLI Binary
        run: |
          cd baihu-panel-src
          CGO_ENABLED=0 go build -o ../baihu ./main.go
          cd ..
          chmod +x ./baihu

      - name: Validate Applications with Baihu CLI (SQLite Dry-Run)
        run: |
          export DB_TYPE="sqlite"
          export DB_DSN="./baihu_ci_test.db"
          for app_file in apps/*/app.yaml; do
            if [ -f "$app_file" ]; then
              echo "=================================================="
              echo ">> 正在对应用规范进行校验与硬核部署测试: $app_file"
              echo "=================================================="
              ./baihu app apply "$app_file" --rebuild || exit 1
            fi
          done

      - name: Commit and Push Changes (Push & Dispatch Only)
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/ apps.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-build): 自动构建更新应用清单与全局索引 [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo ">> 没有检测到应用清单变动，无需推送提交。"
          fi

      - name: Prepare Pages Artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp apps.json _site/
          # 拷贝各个应用的 app.yaml 供静态访问
          mkdir -p _site/apps
          cp -r apps/* _site/apps/ 2>/dev/null || true

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appstore-dist
          path: |
            apps.json
            apps/**/app.yaml

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge jsDelivr CDN Cache
        run: |
          echo ">> 正在强刷 jsDelivr CDN 全球节点缓存..."
          curl -s https://purge.jsdelivr.net/gh/engigu/baihu-appstore@main/apps.json || true

