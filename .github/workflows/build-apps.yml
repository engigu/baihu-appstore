name: Build & Deploy Baihu AppStore
 
on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'build-all.py'
      - 'requirements.txt'
      - '.github/workflows/build-apps.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      panel_branch:
        description: 'baihu-panel 验证分支'
        required: false
        default: 'main'
        type: string
  schedule:
    # 每天北京时间早晨 8:00 (UTC 0:00) 自动同步构建上游规则
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 步骤 1: 扫描所有 app 并单次编译 Baihu CLI 二进制供所有矩阵节点共享
  prepare:
    name: Prepare App Matrix & Build CLI
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4

      - name: Generate Matrix Config
        id: set-matrix
        run: |
          APPS=$(python3 -c 'import os, json; print(json.dumps([os.path.join("apps", d, "app.yaml") for d in os.listdir("apps") if os.path.isfile(os.path.join("apps", d, "app.yaml"))]))')
          echo "matrix={\"app\": $APPS}" >> $GITHUB_OUTPUT

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Checkout Baihu Panel Engine
        uses: actions/checkout@v4
        with:
          repository: 'engigu/baihu-panel'
          ref: ${{ github.event.inputs.panel_branch || 'main' }}
          path: 'baihu-panel-src'

      - name: Build Baihu CLI Binary (Single Build)
        run: |
          cd baihu-panel-src
          CGO_ENABLED=0 go build -o ../baihu ./main.go
          cd ..
          chmod +x ./baihu

      - name: Upload Baihu CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baihu-cli-binary
          path: ./baihu

  # 步骤 2: 矩阵并行对每个应用运行 CLI 硬核验证 (仅需下载编译好的 CLI，无重复编译)
  validate:
    name: Validate (${{ matrix.app }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4

      - name: Download Baihu CLI Binary
        uses: actions/download-artifact@v4
        with:
          name: baihu-cli-binary
          path: ./

      - name: Ensure CLI Executable
        run: chmod +x ./baihu

      - name: Install Mise CLI
        uses: jdx/mise-action@v2

      - name: Dry-Run App Deployment with SQLite
        run: |
          export DB_TYPE="sqlite"
          export DB_DSN="./baihu_ci_test.db"
          echo "=================================================="
          echo ">> 正在对应用进行矩阵并行硬核部署测试: ${{ matrix.app }}"
          echo "=================================================="
          ./baihu app apply "${{ matrix.app }}" --rebuild

  # 步骤 3: 校验全部通过后，构建索引、提交代码并部署 Pages
  build:
    name: Build All & Package
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AppStore Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Global AppStore Builder
        run: |
          python build-all.py

      - name: Commit and Push Changes (Push & Dispatch Only)
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/ apps.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-build): 自动构建更新应用清单与全局索引 [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo ">> 没有检测到应用清单变动，无需推送提交。"
          fi

      - name: Prepare Pages Artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp apps.json _site/
          mkdir -p _site/apps
          cp -r apps/* _site/apps/ 2>/dev/null || true

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appstore-dist
          path: |
            apps.json
            apps/**/app.yaml

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge jsDelivr CDN Cache
        run: |
          echo ">> 正在强刷 jsDelivr CDN 全球节点缓存..."
          curl -s https://purge.jsdelivr.net/gh/engigu/baihu-appstore@main/apps.json || true
